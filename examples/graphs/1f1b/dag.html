  const key=lane(n), d=depth.get(n.id);maxDepth=Math.max(maxDepth,d);
  if(!lanes.has(key)) lanes.set(key,{counts:new Map(),rows:1});
  const l=lanes.get(key),slot=l.counts.get(d)||0;l.counts.set(d,slot+1);l.rows=Math.max(l.rows,slot+1);
  coords.set(n.id,{x:margin+d*dx,slot,l});
}
const width=margin+maxDepth*dx+w+45;let y=18;
for(const [key,l] of [...lanes].sort(([a],[b])=>a.localeCompare(b,"en",{numeric:true}))){
  l.y=y;const height=l.rows*dy+12;
  element("rect",{x:4,y,width:width-8,height,fill:"#fff",rx:5,stroke:"#dde6e1"},svg);
  element("text",{x:14,y:y+32,fill:"#586e70","font-size":12},svg,key.length>18?key.slice(0,17)+"…":key);
  y+=height+6;
}
const height=y+12;svg.setAttribute("viewBox","0 0 "+width+" "+height);
for(const p of coords.values()) p.y=p.l.y+12+p.slot*dy;
const edgeLayer=element("g",{},svg), nodeLayer=element("g",{},svg), critical=new Set(data.critical),parallelEdges=new Map();
for(const e of edges){
  const a=coords.get(e.source),b=coords.get(e.target),x1=a.x+w,y1=a.y+h/2,y2=b.y+h/2;
  const pair=JSON.stringify([e.source,e.target]),index=parallelEdges.get(pair)||0;
  parallelEdges.set(pair,index+1);
  const offset=5*index, path=element("path",{class:"edge",d:"M"+x1+" "+(y1+offset)+" H"+(x1+8)+" L"+(b.x-15)+" "+(y2+offset)+" H"+b.x,"marker-end":"url(#arrow)",
    "data-source":e.source,"data-target":e.target,"data-kind":e.kind},edgeLayer);
  if(e.kind==="stage_order")path.setAttribute("stroke-dasharray","4 3");
  element("title",{},path,e.kind+" · "+e.source+" → "+e.target);
}
const palette={f:["#e4f3eb","#69a98c"],b:["#fff0df","#c48d58"],p:["#e4f2f9","#71a5bf"],d:["#eeeaf8","#a28dbd"],other:["#eef0ef","#9eaeae"]};
function inspect(n,g){
  svg.querySelector(".selected")?.classList.remove("selected");g.classList.add("selected");
  for(const p of edgeLayer.children) p.classList.toggle("related",p.dataset.source===n.id||p.dataset.target===n.id);
  get("inspector").hidden=false;get("nodeTitle").textContent=n.id;
  get("properties").textContent=JSON.stringify({event:n,estimate:data.details[n.id]},null,2);
}
for(const n of nodes){
  const p=coords.get(n.id), k=n.kind, colors=k==="pp_send"?palette.p:["all_reduce","all_gather","reduce_scatter"].includes(k)?palette.d:
    k.startsWith("f")?palette.f:/back|grad|^b/.test(k)?palette.b:palette.other;
  const g=element("g",{class:"node","data-id":n.id,tabindex:0,role:"button","aria-label":n.id,transform:"translate("+p.x+" "+p.y+")"},nodeLayer);
  element("title",{},g,n.id);element("rect",{width:w,height:h,rx:6,fill:colors[0],stroke:colors[1],"stroke-width":1.4},g);
  const eventName=k==="pp_send"?(n.direction==="backward"?"PP backward":"PP forward"):k.replaceAll("_"," ");
  const arrow=n.pipeline_direction==="increasing_stage"?" →":n.pipeline_direction==="decreasing_stage"?" ←":"";
  element("text",{x:9,y:18,"font-size":12,"font-weight":650,fill:"#183637"},g,eventName+arrow);
  const chunk=data.schedule==="vpp"?(n.chunk!=null?"C"+n.chunk:n.source_chunk!=null?"C"+n.source_chunk+"→"+n.target_chunk:""):"";
  const label=[n.stage!=null?"S"+n.stage:"",chunk,n.layer!=null?"L"+n.layer:"",n.microbatch!=null?"MB"+n.microbatch:"",n.bytes!=null&&n.microbatch==null?n.bytes+" B":""].filter(Boolean).join(" · ");
  element("text",{x:9,y:34,"font-size":10,fill:"#425e5f"},g,label);
  g.onclick=()=>inspect(n,g);g.onkeydown=e=>{if(e.key==="Enter")inspect(n,g);};
}
get("critical").onchange=e=>{for(const g of nodeLayer.children)g.style.opacity=e.target.checked&&!critical.has(g.dataset.id)?0.45:1;};
get("close").onclick=()=>{get("inspector").hidden=true;svg.querySelector(".selected")?.classList.remove("selected");for(const p of edgeLayer.children)p.classList.remove("related");};
let zoom=1;
function resize(next,anchorX=view.clientWidth/2,anchorY=view.clientHeight/2){
  const prev=zoom,x=(view.scrollLeft+anchorX)/prev,y=(view.scrollTop+anchorY)/prev;
  zoom=Math.max(0.0001,Math.min(4,next));svg.style.width=(width*zoom)+"px";svg.style.height=(height*zoom)+"px";
  view.scrollLeft=x*zoom-anchorX;view.scrollTop=y*zoom-anchorY;get("scale").textContent=(zoom*100).toFixed(zoom<0.1?1:0)+"%";
}
get("fit").onclick=()=>{resize(Math.min(1,(view.clientWidth-4)/width,(view.clientHeight-4)/height));view.scrollTo(0,0);};
get("reset").onclick=()=>resize(1);get("in").onclick=()=>resize(zoom*1.3);get("out").onclick=()=>resize(zoom/1.3);
view.addEventListener("wheel",e=>{if(e.ctrlKey){e.preventDefault();const r=view.getBoundingClientRect();resize(zoom*(e.deltaY<0?1.14:1/1.14),e.clientX-r.left,e.clientY-r.top);}},{passive:false});
let drag;
view.onpointerdown=e=>{if(!e.target.closest(".node")&&e.button===0){drag=[e.clientX,e.clientY,view.scrollLeft,view.scrollTop];view.setPointerCapture(e.pointerId);}};
view.onpointermove=e=>{if(drag)view.scrollTo(drag[2]+drag[0]-e.clientX,drag[3]+drag[1]-e.clientY);};
view.onpointerup=view.onpointercancel=()=>{drag=null;};
resize(Math.min(1,Math.max(.55,view.clientHeight/height)),0,0);
</script></body></html>
